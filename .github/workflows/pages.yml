name: Build and Deploy Leaderboard to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "results/**"
      - "scripts/build_leaderboard.py"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (without heavy PDK submodule)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate results & build docs/data/leaderboard.json
        run: |
          python3 scripts/build_leaderboard.py
          python3 -c '
          import json
          from pathlib import Path
          data = json.loads(Path("docs/data/leaderboard.json").read_text())
          assert data["mode"] == "single_core"
          assert isinstance(data["entries"], list)
          print(f"Validated leaderboard.json: {data[\"entry_count\"]} entries")
          '

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
